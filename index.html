<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Buksan mo papasukin ako🔐</title>

<style>
body {
   margin: 0;
    height: 100vh;
    /* Corrected syntax: use url() and ensure the filename matches exactly */
    background-image: url("BTS.jpg"); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: 'Segoe UI', sans-serif;
    color: #883ee3;
    overflow: hidden;
    touch-action: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}

/* Added an overlay to make sure keys and text are visible against the image */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4); /* Darkens the image slightly */
    z-index: 0;
}

.title {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 1.3rem;
    z-index: 10;
    padding: 0 20px;
    box-sizing: border-box;
    transition: all 0.5s ease;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
}

.message {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 1.1rem;
    z-index: 10;
    transition: all 0.5s ease;
    background: rgba(187, 134, 252, 0.3); /* Purple tint */
    padding: 5px 0;
}

/* PADLOCK */
.lock-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    
    /* Change size here */
    font-size: 6.5rem; 
    
    /* This creates a beautiful purple BTS-inspired glow */
    text-shadow: 0 0 20px #bb86fc, 0 0 40px #800080;
    
    /* This tints the yellow lock to purple */
    filter: sepia(100%) hue-rotate(250deg) saturate(300%);
    
    z-index: 5;
    transition: transform 1.5s ease;
}
.lock-open {
    animation: openLock 2s ease forwards;
}

@keyframes openLock {
    0%   { transform: translate(-50%, -50%) rotate(0); }
    40%  { transform: translate(-50%, -50%) rotate(-10deg); }
    70%  { transform: translate(-50%, -70%) rotate(10deg); }
    100% { transform: translate(-50%, -120%) rotate(0); opacity: 0; }
}

/* KEYS */
.key {
    position: absolute;
    font-size: 2.2rem;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s;
    z-index: 5;
}

.key:hover {
    transform: scale(1.3) rotate(10deg);
}

.insert-key {
    transition: all 1.8s ease;
    z-index: 15;
}

/* SECRET MESSAGE */
.secret {
    position: fixed;
    inset: 0;
    background: rgba(26, 0, 46, 0.95); /* Deep Purple */
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 1.6rem;
    color: #bb86fc;
    z-index: 20;
    animation: fadeIn 1s ease;
    flex-direction: column;
    padding: 20px;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.buttons {
    margin-top: 30px;
    position: relative;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.buttons button {
    background: #bb86fc; /* BTS Purple */
    color: #fff;
    border: none;
    padding: 12px 25px;
    margin: 10px;
    font-size: 1rem;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s;
    font-weight: bold;
}

/* LOADING PROGRESS BAR */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 50;
    color: #bb86fc;
    font-size: 1.2rem;
}

.progress-container {
    width: 70%;
    height: 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 20px;
    position: relative;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #bb86fc;
    border-radius: 10px;
    transition: width 0.1s linear;
}

.dog-icon {
    position: absolute;
    top: -15px;
    font-size: 1.8rem;
    transition: left 0.1s linear;
    animation: runMotion 0.5s ease-in-out infinite;
}

@keyframes runMotion {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

/* --- REVISED RESPONSIVE STYLES --- */
@media (max-width: 600px) {
    .title { font-size: 1rem; top: 15%; }
    .message { font-size: 0.9rem; bottom: 20%; }
    .lock-container { font-size: 4rem; }
    .key { font-size: 1.8rem; }
    .secret { font-size: 1.1rem; }
    .progress-container { width: 85%; }
}

.popup-container {
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #bb86fc;
    border-radius: 15px;
    padding: 30px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 90%;
    box-shadow: 0 0 20px #bb86fc;
}

.popup-message {
    font-size: 1.6rem;
    text-align: center;
    color: #bb86fc;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="title">
    Are you ready to find out what secret behind this?<br>
    Tap the correct "💜" to open the lock!
</div>

<div class="lock-container" id="lock" style="font-size: 6rem; filter: drop-shadow(0 0 10px #800080) sepia(100%) hue-rotate(240deg) saturate(500%);">🔒</div>
<div class="message" id="message"></div>

<div class="secret" id="secret">
    <div class="popup-container">
        <div class="popup-message"> 💜Congrats! You found my heart!💜</div>
        <div class="buttons">
            <button id="proceedBtn">Proceed</button>
            <button id="exitBtn">Exit</button>
        </div>
    </div>
</div>

<div class="loading-overlay" id="loading">
    <div>Borahae! Loading the secret story...</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="dog-icon" id="dogIcon">💜</div>
    </div>
</div>

<script>
const totalKeys = 12; 
const correctKey = Math.floor(Math.random() * totalKeys);
const keys = [];
const speeds = [];
let unlocked = false;

const lock = document.getElementById("lock");
const secret = document.getElementById("secret");
const proceedBtn = document.getElementById("proceedBtn");
const exitBtn = document.getElementById("exitBtn");
const loading = document.getElementById("loading");
const progressBar = document.getElementById("progressBar");
const dogIcon = document.getElementById("dogIcon");

for (let i = 0; i < totalKeys; i++) {
    const key = document.createElement("div");
    key.className = "key";
    // Changed from 🔑 to 💜
    key.textContent = "💜"; 
    key.style.left = Math.random() * (window.innerWidth - 50) + "px";
    key.style.top = Math.random() * (window.innerHeight - 100) + 50 + "px";

    speeds.push({
        x: (Math.random() * 1.2 + 0.4) * (Math.random() < 0.5 ? -1 : 1),
        y: (Math.random() * 1.2 + 0.4) * (Math.random() < 0.5 ? -1 : 1)
    });

    key.onclick = () => {
        if (unlocked) return;
        if (i === correctKey) insertKey(key);
        else tease();
    };

    document.body.appendChild(key);
    keys.push(key);
}

// Update the tease messages to match the hearts
function tease() {
    const messages = ["❌ Wrong heart!", "💜 Not this one!", "😏 Keep looking, ARMY!", "🚫 Try another heart."];
    document.getElementById("message").textContent = messages[Math.floor(Math.random() * messages.length)];
}

// Update the insertion text
function insertKey(key) {
    unlocked = true;
    document.getElementById("message").textContent = "💜 You found the right heart! Unlocking...";
    speeds.forEach(s => { s.x = 0; s.y = 0; });

    const lockRect = lock.getBoundingClientRect();
    key.classList.add("insert-key");
    key.style.left = (lockRect.left + lockRect.width / 2 - 15) + "px";
    key.style.top = (lockRect.top + lockRect.height / 2 + 20) + "px";
    key.style.transform = "scale(1.5)"; // Removed rotation for the heart

    setTimeout(() => {
        lock.textContent = "🔓";
        lock.classList.add("lock-open");
    }, 1800);

    setTimeout(() => {
        secret.style.display = "flex";
    }, 3600);
}

window.addEventListener('resize', () => {
    keys.forEach(key => {
        let x = parseFloat(key.style.left);
        let y = parseFloat(key.style.top);
        if (x > window.innerWidth - 50) key.style.left = (window.innerWidth - 50) + "px";
        if (y > window.innerHeight - 50) key.style.top = (window.innerHeight - 50) + "px";
    });
});

function tease() {
    const messages = ["❌ Wrong key!", "🔒 Doesn't fit.", "😏 Try again.", "🗝️ Keep looking!", "🚫 Locked tight."];
    document.getElementById("message").textContent = messages[Math.floor(Math.random() * messages.length)];
}

function insertKey(key) {
    unlocked = true;
    document.getElementById("message").textContent = "💜 Heart inserted… unlocked";
    speeds.forEach(s => { s.x = 0; s.y = 0; });

    const lockRect = lock.getBoundingClientRect();
    key.classList.add("insert-key");
    key.style.left = (lockRect.left + lockRect.width / 2 - 15) + "px";
    key.style.top = (lockRect.top + lockRect.height / 2 + 20) + "px";
    key.style.transform = "rotate(90deg) scale(1.2)";

    setTimeout(() => {
        lock.textContent = "🔓";
        lock.classList.add("lock-open");
    }, 1800);

    setTimeout(() => {
        secret.style.display = "flex";
    }, 3600);
}

proceedBtn.onclick = () => {
    secret.style.display = "flex";
    loading.style.display = "flex";

    let progress = 0;
    const duration = 5000; 
    const intervalTime = 50; 
    const increment = (intervalTime / duration) * 100;

    const interval = setInterval(() => {
        progress += increment;
        if (progress > 100) progress = 100;

        progressBar.style.width = progress + "%";
        const containerWidth = progressBar.parentElement.offsetWidth;
        dogIcon.style.left = (containerWidth * progress / 100 - 15) + "px";

        if (progress >= 100) {
            clearInterval(interval);
            window.location.href = "second.html"; 
        }
    }, intervalTime);
};

exitBtn.addEventListener("mouseover", moveExitButton);
exitBtn.addEventListener("touchstart", (e) => {
    e.preventDefault(); 
    moveExitButton();
});

function moveExitButton() {
    const btnWidth = exitBtn.offsetWidth;
    const btnHeight = exitBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth - 40;
    const maxY = window.innerHeight - btnHeight - 40;
    exitBtn.style.position = "absolute";
    exitBtn.style.left = Math.max(20, Math.random() * maxX) + "px";
    exitBtn.style.top = Math.max(20, Math.random() * maxY) + "px";
}

function animate() {
    if (unlocked) return;
    keys.forEach((key, i) => {
        let x = key.offsetLeft + speeds[i].x;
        let y = key.offsetTop + speeds[i].y;
        if (x <= 0 || x + key.offsetWidth >= window.innerWidth) speeds[i].x *= -1;
        if (y <= 10 || y + key.offsetHeight >= window.innerHeight - 10) speeds[i].y *= -1;
        key.style.left = x + "px";
        key.style.top = y + "px";
    });
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
