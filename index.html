<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Unlock the Secret 🔐</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1a1a2e, #000);
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}

.title {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 1.3rem;
    z-index: 10;
    padding: 0 20px;
    box-sizing: border-box;
    transition: all 0.5s ease;
}

.message {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 1.1rem;
    z-index: 10;
    transition: all 0.5s ease;
}

/* PADLOCK */
.lock-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 5rem;
    z-index: 5;
    transition: transform 1.5s ease;
}

.lock-open {
    animation: openLock 2s ease forwards;
}

@keyframes openLock {
    0%   { transform: translate(-50%, -50%) rotate(0); }
    40%  { transform: translate(-50%, -50%) rotate(-10deg); }
    70%  { transform: translate(-50%, -70%) rotate(10deg); }
    100% { transform: translate(-50%, -120%) rotate(0); opacity: 0; }
}

/* KEYS */
.key {
    position: absolute;
    font-size: 2.2rem;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s;
}

.key:hover {
    transform: scale(1.3) rotate(10deg);
}

.insert-key {
    transition: all 1.8s ease;
    z-index: 15;
}

/* SECRET MESSAGE */
.secret {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 1.6rem;
    color: #00ffcc;
    z-index: 20;
    animation: fadeIn 1s ease;
    flex-direction: column;
    padding: 20px;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.buttons {
    margin-top: 30px;
    position: relative;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.buttons button {
    background: #00ffcc;
    color: #000;
    border: none;
    padding: 12px 25px;
    margin: 10px;
    font-size: 1rem;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s;
}

/* LOADING PROGRESS BAR */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 50;
    color: #00ffcc;
    font-size: 1.2rem;
}

.progress-container {
    width: 70%;
    height: 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 20px;
    position: relative;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #00ffcc;
    border-radius: 10px;
    transition: width 0.1s linear;
}

.dog-icon {
    position: absolute;
    top: -15px;
    font-size: 1.8rem;
    transition: left 0.1s linear;
    animation: runMotion 0.5s ease-in-out infinite;
}

@keyframes runMotion {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

/* --- REVISED RESPONSIVE STYLES --- */
@media (max-width: 600px) {
    .title { 
        font-size: 1rem; 
        top: 15%; 
    }
    
    .message { 
        font-size: 0.9rem; 
        bottom: 20%; 
    }

    .lock-container { 
        font-size: 4rem; 
    }

    .key { 
        font-size: 1.8rem; 
    }

    .secret { 
        font-size: 1.1rem; 
    }

    .progress-container { 
        width: 85%; 
    }
}

@media (max-height: 500px) {
    .title { top: 5px; font-size: 0.9rem; }
    .message { bottom: 5px; }
}
</style>
</head>

<body>

<div class="title">
    Are you ready to find out what secret behind this site?<br>
    Find the correct key and unlock the padlock 🔑
</div>

<div class="lock-container" id="lock">🔒</div>
<div class="message" id="message"></div>

<div class="secret" id="secret">
    🎉 Congrats! You found the right key! 🎉
    <div class="buttons">
        <button id="proceedBtn">Proceed</button>
        <button id="exitBtn">Exit</button>
    </div>
</div>

<div class="loading-overlay" id="loading">
    <div>Loading the secret story...</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="dog-icon" id="dogIcon">🐕</div>
    </div>
</div>

<script>
const totalKeys = 12; 
const correctKey = Math.floor(Math.random() * totalKeys);
const keys = [];
const speeds = [];
let unlocked = false;

const lock = document.getElementById("lock");
const secret = document.getElementById("secret");
const proceedBtn = document.getElementById("proceedBtn");
const exitBtn = document.getElementById("exitBtn");
const loading = document.getElementById("loading");
const progressBar = document.getElementById("progressBar");
const dogIcon = document.getElementById("dogIcon");

for (let i = 0; i < totalKeys; i++) {
    const key = document.createElement("div");
    key.className = "key";
    key.textContent = "🔑";
    key.style.left = Math.random() * (window.innerWidth - 50) + "px";
    key.style.top = Math.random() * (window.innerHeight - 100) + 50 + "px";

    speeds.push({
        x: (Math.random() * 1.2 + 0.4) * (Math.random() < 0.5 ? -1 : 1),
        y: (Math.random() * 1.2 + 0.4) * (Math.random() < 0.5 ? -1 : 1)
    });

    key.onclick = () => {
        if (unlocked) return;
        if (i === correctKey) insertKey(key);
        else tease();
    };

    document.body.appendChild(key);
    keys.push(key);
}

window.addEventListener('resize', () => {
    keys.forEach(key => {
        let x = parseFloat(key.style.left);
        let y = parseFloat(key.style.top);
        if (x > window.innerWidth - 50) key.style.left = (window.innerWidth - 50) + "px";
        if (y > window.innerHeight - 50) key.style.top = (window.innerHeight - 50) + "px";
    });
});

function tease() {
    const messages = ["❌ Wrong key!", "🔒 Doesn't fit.", "😏 Try again.", "🗝️ Keep looking!", "🚫 Locked tight."];
    document.getElementById("message").textContent = messages[Math.floor(Math.random() * messages.length)];
}

function insertKey(key) {
    unlocked = true;
    document.getElementById("message").textContent = "🔑 Key inserted… unlocking slowly";
    speeds.forEach(s => { s.x = 0; s.y = 0; });

    const lockRect = lock.getBoundingClientRect();
    key.classList.add("insert-key");
    key.style.left = (lockRect.left + lockRect.width / 2 - 15) + "px";
    key.style.top = (lockRect.top + lockRect.height / 2 + 20) + "px";
    key.style.transform = "rotate(90deg) scale(1.2)";

    setTimeout(() => {
        lock.textContent = "🔓";
        lock.classList.add("lock-open");
    }, 1800);

    setTimeout(() => {
        secret.style.display = "flex";
    }, 3600);
}

// --- REVISION: PROGRESS BAR REDIRECT ---
proceedBtn.onclick = () => {
    secret.style.display = "flex";
    loading.style.display = "flex";

    let progress = 0;
    const duration = 5000; // Time in milliseconds (5 seconds)
    const intervalTime = 50; 
    const increment = (intervalTime / duration) * 100;

    const interval = setInterval(() => {
        progress += increment;
        if (progress > 100) progress = 100;

        progressBar.style.width = progress + "%";
        const containerWidth = progressBar.parentElement.offsetWidth;
        dogIcon.style.left = (containerWidth * progress / 100 - 15) + "px";

        if (progress >= 100) {
            clearInterval(interval);
            // REPLACE "valentines.html" WITH YOUR ACTUAL TARGET FILENAME
            window.location.href = "second.html"; 
        }
    }, intervalTime);
};

exitBtn.addEventListener("mouseover", moveExitButton);
exitBtn.addEventListener("touchstart", (e) => {
    e.preventDefault(); 
    moveExitButton();
});

function moveExitButton() {
    const btnWidth = exitBtn.offsetWidth;
    const btnHeight = exitBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth - 40;
    const maxY = window.innerHeight - btnHeight - 40;
    exitBtn.style.position = "absolute";
    exitBtn.style.left = Math.max(20, Math.random() * maxX) + "px";
    exitBtn.style.top = Math.max(20, Math.random() * maxY) + "px";
}

function animate() {
    if (unlocked) return;
    keys.forEach((key, i) => {
        let x = key.offsetLeft + speeds[i].x;
        let y = key.offsetTop + speeds[i].y;
        if (x <= 0 || x + key.offsetWidth >= window.innerWidth) speeds[i].x *= -1;
        if (y <= 10 || y + key.offsetHeight >= window.innerHeight - 10) speeds[i].y *= -1;
        key.style.left = x + "px";
        key.style.top = y + "px";
    });
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
