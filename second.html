<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>A Divine Connection 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #32f542, #c1a79f);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    perspective: 1200px;
}

/* 🌸 FLOWER RAIN */
.flower { position: absolute; top: -10vh; font-size: 2rem; pointer-events: none; z-index: 1; animation: flowerFall linear forwards; opacity: 0.9; filter: blur(0.5px); }
@keyframes flowerFall { from { transform: translateY(-10vh) rotate(0deg); opacity: 1; } to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

/* 🌬️ WIND EFFECT */
@keyframes sway {
    0% { transform: translateX(0px) rotate(0deg); }
    50% { transform: translateX(20px) rotate(5deg); }
    100% { transform: translateX(0px) rotate(0deg); }
}

/* 🌱 BLOOMING FLOWERS */
.blooming-flower {
    position: absolute;
    bottom: 0; 
    font-size: 0;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    animation: riseAndBloom linear forwards;
    filter: drop-shadow(0 5px 20px rgba(0,0,0,0.3));
}
@keyframes riseAndBloom {
    0% { transform: translateY(0) scale(0); opacity: 0; }
    50% { transform: translateY(-30vh) scale(0.5); opacity: 0.7; }
    100% { transform: translateY(-60vh) scale(1); opacity: 1; }
}

/* 🌳 TREE */
.tree {
    position: absolute;
    bottom: 0;
    left: 5%; 
    width: 80px;
    height: 180px;
    z-index: 0;
}
.tree-trunk {
    width: 20px;
    height: 100%;
    background: #8B5A2B;
    margin: 0 auto;
    border-radius: 10px;
}
.tree-leaves {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle at center, #228B22 0%, #006400 80%);
    border-radius: 50%;
    position: absolute;
    top: -60px;
    left: -20px;
}

/* STORY BOX */
.story-box { position: relative; z-index: 10; background: linear-gradient(to bottom, #fdf6e3, #f2e8d5); border: 5px solid #00ffcc; border-radius: 20px; width: 90%; max-width: 650px; min-height: 250px; padding: 40px; display: flex; justify-content: center; align-items: center; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.4), inset 0 0 20px rgba(0,0,0,0.05); font-family: 'Georgia', 'Times New Roman', serif; color: #3b2f2f; background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png'); background-size: cover; transform: rotateX(0deg) rotateY(0deg); display: none; animation: popVintage 1s ease forwards; }
@keyframes popVintage { from { transform: scale(0.8) rotateX(5deg); opacity: 0; } to { transform: scale(1) rotateX(0deg); opacity: 1; } }
#story { font-size: 1.25rem; line-height: 1.6em; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,0.5); }

/* HEARTS */
.heart { position: absolute; font-size: 2rem; animation: float linear infinite; pointer-events: none; z-index: 2; }
@keyframes float { from { transform: translateY(100vh); opacity: 1; } to { transform: translateY(-10vh); opacity: 0; } }

/* LOADING TEXT */
#loadingText { position: absolute; z-index: 20; font-size: 2rem; color: #fff; text-align: center; }

/* QUESTION POPUP */
.question-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 50; animation: popupFade 0.5s ease; }
@keyframes popupFade { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
.question-box { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; animation: boxPop 0.5s ease; border: 5px solid #00ffcc; }
@keyframes boxPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
.yes-btn { background: #ff4081; color: white; }
.no-btn { background: #ccc; }
button { padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; }

/* ❌ EXIT BUTTON */
#exitBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 8px 12px;
    background: crimson;
    color: white;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    display: none;
    z-index: 100;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

/* 🖥️ SYSTEM BLACKOUT */
#blackout {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

#blackoutText {
    color: red;
    font-size: 2rem;
    font-family: monospace;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

</style>

<body>

<!-- TREE -->
<div class="tree">
    <div class="tree-trunk"></div>
    <div class="tree-leaves"></div>
</div>

<!-- LOADING TEXT -->
<div id="loadingText">Generating story...</div>

<!-- STORY BOX -->
<div class="story-box" id="storyBox">
    <div id="story"></div>
</div>

<!-- MAIN POPUP -->
<div class="question-popup" id="questionPopup">
    <div class="question-box">
        <h2>☕ Can I buy you a cup of coffee?</h2>
        <button class="yes-btn" id="yesBtn">Yes</button>
        <button class="no-btn" id="noBtn">No</button>
    </div>
</div>
<!-- EXIT BUTTON -->
<button id="exitBtn">✖ Exit</button>

<!-- SYSTEM BLACKOUT -->
<div id="blackout">
    <div id="blackoutText">⚠ SYSTEM ERROR</div>
</div>

<script>
/* STORY LINES */
const storyLines = [
    { text: "One guy lived his life through glowing screens and complex codes.", effect: "glow" },
    { text: "Days blurred into nights as he solved problems no one else could see.", effect: "glow" },
    { text: "Across town, one girl worked quietly as an office clerk.", effect: "glow" },
    { text: "Her desk was simple, her work steady, her heart full of patience.", effect: "glow" },
    { text: "They were two strangers, never imagining their paths would cross.", effect: "glow" },
    { text: "Living separate lives, guided by different routines.", effect: "glow" },
    { text: "A sudden system crash brought the guy to her office.", effect: "glow" },
    { text: "What started as a technical problem became a turning point.", effect: "glow" },
    { text: "He noticed a small Bible verse taped to her monitor.", effect: "smile" },
    { text: "It spoke about faith, hope, and trusting God’s timing.", effect: "smile" },
    { text: "She offered a kind smile.", effect: "smile" },
    { text: "A simple gesture that made the noisy world feel calm.", effect: "smile" },
    { text: "Over time, technical issues became an excuse to talk.", effect: "heart-burst" },
    { text: "Short conversations slowly turned into shared laughter.", effect: "heart-burst" },
    { text: "They learned about each other’s dreams and fears.", effect: "heart-burst" },
    { text: "Faith and purpose connected them deeply.", effect: "heart-burst" },
    { text: "They realized some meetings are not accidents.", effect: "heart-burst" },
    { text: "The guy found himself looking forward to system errors.", effect: "heart-burst" },
    { text: "The girl prayed quietly for clarity in her heart.", effect: "heart-burst" },
    { text: "And then, one ordinary day felt different.", effect: "rose" },
    { text: "With courage and a nervous smile, the guy finally asked…", effect: "rose" }
];

let line = 0, char = 0;
const speed = 40;
const storyDiv = document.getElementById("story");
const storyBox = document.getElementById("storyBox");
const loadingText = document.getElementById("loadingText");
const popup = document.getElementById("questionPopup");

/* LOADING SEQUENCE */
function startLoadingSequence() {
    loadingText.innerText = "Generating story...";
    setTimeout(() => {
        loadingText.innerText = "Publishing story...";
        setTimeout(() => {
            loadingText.innerText = "Story opening...";
            setTimeout(() => {
                loadingText.style.display = "none";
                storyBox.style.display = "flex";
                typeStory();
            }, 3000);
        }, 2000);
    }, 2000);
}

/* TYPEWRITER STORY */
function typeStory() {
    if (line < storyLines.length) {
        if (char < storyLines[line].text.length) {
            storyDiv.innerHTML += storyLines[line].text.charAt(char++);
            setTimeout(typeStory, speed);
        } else {
            setTimeout(() => {
                storyDiv.innerHTML = "";
                char = 0;
                line++;
                typeStory();
            }, 2000);
        }
    } else {
        popup.style.display = "flex";
    }
}

/* 💖 HEARTS */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 700);

/* 🌸 FLOWER RAIN */
const flowers = ["🌸","🌺","🌼","💐"];
setInterval(() => {
    const flower = document.createElement("div");
    flower.className = "flower";
    flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
    flower.style.left = Math.random() * 100 + "vw";
    flower.style.animationDuration = (Math.random() * 4 + 6) + "s";
    document.body.appendChild(flower);
    setTimeout(() => flower.remove(), 12000);
}, 500);

/* 🌸 BLOOMING FLOWERS AT BOTTOM WITH WIND */
const bloomingFlowers = ["🌸","🌺","🌼","💐"];
setInterval(() => {
    const flowerCount = Math.floor(Math.random() * 3) + 3; 
    for (let i = 0; i < flowerCount; i++) {
        const bloom = document.createElement("div");
        bloom.className = "blooming-flower";
        bloom.textContent = bloomingFlowers[Math.floor(Math.random() * bloomingFlowers.length)];
        bloom.style.left = Math.random() * 100 + "vw";
        bloom.style.fontSize = (Math.random() * 2.5 + 2) + "rem";
        bloom.style.animationDuration = (Math.random() * 5 + 8) + "s, " + (Math.random() * 3 + 3) + "s";
        bloom.style.animationName = "riseAndBloom, sway";
        bloom.style.animationIterationCount = "1, infinite";
        bloom.style.animationTimingFunction = "ease-out, ease-in-out";
        document.body.appendChild(bloom);
        setTimeout(() => bloom.remove(), 12000);
    }
}, 800);

/* POPUP BUTTON LOGIC */
function showPopupMessage(message, duration = 0, returnToChoices = false) {
    popup.style.display = "flex";
    popup.innerHTML = `
        <div class="question-box">
            <h2>${message}</h2>
        </div>
    `;
    if (duration > 0) {
        setTimeout(() => {
            if (returnToChoices) {
                popup.innerHTML = `
                    <div class="question-box">
                        <h2>☕ Can I treat you a cup of coffee?</h2>
                        <button class="yes-btn" id="yesBtn">Yes</button>
                        <button class="no-btn" id="noBtn">No</button>
                    </div>
                `;
                attachButtonLogic();
            } else popup.style.display = "none";
        }, duration);
    }
}


function attachButtonLogic() {
    document.getElementById("noBtn").onclick = () => {
        showPopupMessage("❌ No button is under maintenance", 4000, true);
    };

    document.getElementById("yesBtn").onclick = () => {
        showPopupMessage("☕ Coffee date settled");

        // Automatically hide the popup after 6 seconds
        setTimeout(() => {
            popup.style.display = "none";

            // Show story box and typewriter the new message after popup disappears
            storyBox.style.display = "flex"; // ensure story box is visible
            const message = "💌 The person who sent this link is waiting for the responce coming from the person who open the link 💖";
            storyDiv.innerHTML = "";
            let i = 0;
            function typeWriter() {
    if (i < message.length) {
        storyDiv.innerHTML += message.charAt(i++);
        setTimeout(typeWriter, 40);
    } else {
        exitBtn.style.display = "block"; // SHOW EXIT BUTTON
    }
}
typeWriter();

        }, 6000); // wait for popup to vanish
    };
}

const exitBtn = document.getElementById("exitBtn");
const blackout = document.getElementById("blackout");
const blackoutText = document.getElementById("blackoutText");

exitBtn.onclick = () => {
    blackout.style.display = "flex";

    // After 5 seconds show prank text
    setTimeout(() => {
        blackoutText.innerText = "😈 It's a prank!";
    }, 5000);

    // Exit page after prank
    setTimeout(() => {
        window.location.href = "about:blank";
    }, 8000);
};


attachButtonLogic();

/* START LOADING SEQUENCE ON PAGE LOAD */
window.onload = startLoadingSequence;
</script>

</body>
</html>
